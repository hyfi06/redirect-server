[package]
name = "rserver"
version = "0.1.0"
edition = "2021"
description = "CLI to manage 1kg.me redirects through the v1 API"
publish = false

[[bin]]
name = "rserver"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
dirs = "7"
serde = { version = "1", features = ["derive"] }
toml = "1"
url = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
