[package]
name = "rserver"
version = "0.1.0"
edition = "2021"
description = "CLI to manage 1kg.me redirects through the v1 API"
publish = false

[[bin]]
name = "rserver"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
dirs = "7"
gethostname = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
url = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
tempfile = "3.27.0"
